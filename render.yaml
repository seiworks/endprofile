services:
  - type: web
    name: endprofile
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4001
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REGISTRATION_INVITE_CODE
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
